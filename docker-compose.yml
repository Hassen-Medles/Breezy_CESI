services:
  nginx:
    image: nginx:latest
    container_name: nginx
    ports:
      - "8080:8080"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - auth-service
      - api
      
  mongo:
    image: mongo:7
    container_name: mongo-breezy
    ports:
      - "27019:27017"
    volumes:
      - mongo_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: breezy_auth

  auth-service:
    build:
      context: ./backend/auth-service
    container_name: auth-service
    ports:
      - "5000:5000"
    env_file:
      - ./backend/auth-service/.env
    depends_on:
      - mongo

  frontend:
    build:
      context: ./frontend
    container_name: frontend
    ports:
      - "3000:3000"
    command: npm run dev
    depends_on:
      - auth-service
  api:
    build:
      context: ./backend/api
    container_name: api
    ports:
      - "5001:5001"
    environment:
      - MONGO_URI=mongodb://mongo:27017/breezy_auth
      - PORT=5001
    depends_on:
      - mongo

volumes:
  mongo_data: